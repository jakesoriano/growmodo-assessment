name: Deploy to InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify FTP secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=()
          [ -z "$FTP_SERVER" ] && missing+=("FTP_SERVER")
          [ -z "$FTP_USERNAME" ] && missing+=("FTP_USERNAME")
          [ -z "$FTP_PASSWORD" ] && missing+=("FTP_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub secrets: ${missing[*]}. Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Deploy theme via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./theme/estatein/
          server-dir: /htdocs/wp-content/themes/estatein/

      - name: Deploy settings plugin via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./plugin/estatein-settings/
          server-dir: /htdocs/wp-content/plugins/estatein-settings/
